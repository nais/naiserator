testconfig:
  description: vanilla application running with nais-system, default configuration and network policies
config:
  features:
    network-policy: true
  google-project-id: google-project-id
  cluster-name: mycluster
  domain-ingressclass-mapping:
    - domainSuffix: .nais.io
      ingressClass: internal-haproxy
    - domainSuffix: .domain
      ingressClass: external-haproxy
  nais-namespace: nais-system
input:
  kind: Application
  apiVersion: nais.io/v1alpha1
  metadata:
    name: myapplication
    namespace: mynamespace
    uid: "123456"
  spec:
    image: navikt/myapplication:1.2.3
    ingresses:
      - 'https://myapplication.dev.nais.io'
      - 'https://myapplication.other.domain'
tests:
  - operation: CreateOrUpdate
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    name: myapplication
    match:
      - name: "network policy created"
        type: subset
        exclude:
          - .metadata
          - .status
        resource:
          spec:
            ingress:
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: nais-system
                    podSelector:
                      matchLabels:
                        nais.io/ingressClass: internal-haproxy
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: nais-system
                    podSelector:
                      matchLabels:
                        nais.io/ingressClass: external-haproxy
            podSelector:
              matchLabels:
                app: myapplication
