testconfig:
  description: application with frontend configuration in a file
config:
  cluster-name: mycluster
  frontend:
    telemetry-url: http://telemetry-collector
input:
  kind: Application
  apiVersion: nais.io/v1alpha1
  metadata:
    name: myapplication
    namespace: mynamespace
    uid: "123456"
  spec:
    image: navikt/myapplication:1.2.3
    frontend:
      generatedConfig:
        mountPath: /path/to/nais.js
tests:
  - apiVersion: v1
    kind: ConfigMap
    name: myapplication-frontend-config-js-cf21ef39
    operation: CreateOrUpdate
    match:
      - type: subset
        name: javascript configuration configmap created
        resource:
          data:
            nais.js: "export default {\n\t\"schemaVersion\": 1,\n\t\"telemetryCollectorURL\": \"http://telemetry-collector\",\n\t\"app\": {\n\t\t\"name\": \"myapplication\",\n\t\t\"namespace\": \"mynamespace\",\n\t\t\"version\": \"1.2.3\"\n\t},\n\t\"environment\": \"mycluster\"\n};\n"
            nais.json: "{\n\t\"schemaVersion\": 1,\n\t\"telemetryCollectorURL\": \"http://telemetry-collector\",\n\t\"app\": {\n\t\t\"name\": \"myapplication\",\n\t\t\"namespace\": \"mynamespace\",\n\t\t\"version\": \"1.2.3\"\n\t},\n\t\"environment\": \"mycluster\"\n}\n"
  - apiVersion: apps/v1
    kind: Deployment
    name: myapplication
    operation: CreateOrUpdate
    match:
      - type: subset
        name: javascript configmap injected to pod
        resource:
          spec:
            template:
              spec:
                volumes:
                  - name: frontend-config
                    configMap:
                      name: myapplication-frontend-config-js-cf21ef39
                containers:
                  - image: navikt/myapplication:1.2.3
                    name: myapplication
                    env:
                      - name: NAIS_FRONTEND_TELEMETRY_COLLECTOR_URL
                        value: http://telemetry-collector
                    volumeMounts:
                      - name: frontend-config
                        readOnly: true
                        mountPath: /path/to/nais.js
                        subPath: nais.js
                      - name: frontend-config
                        readOnly: true
                        mountPath: /path/to/nais.json
                        subPath: nais.json
