testconfig:
  description: ingress resource is created on-premises
config:
  domain-ingressclass-mapping:
    - domainSuffix: .bar
      ingressClass: very-haproxy
input:
  kind: Application
  apiVersion: nais.io/v1alpha1
  metadata:
    name: myapplication
    namespace: mynamespace
    uid: "123456"
  spec:
    ingresses:
      - https://foo.bar
    service:
      protocol: grpc
existing:
  - kind: Namespace
    apiVersion: v1
    metadata:
      name: mynamespace
tests:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: myapplication-very-haproxy-efe42262
    operation: CreateOrUpdate
    match:
      - type: subset
        name: "HAProxy ingress for foo.bar routes to the GRPC service"
        resource:
          spec:
            ingressClassName: "very-haproxy"
            rules:
              - host: foo.bar
                http:
                  paths:
                    - backend:
                        service:
                          name: myapplication
                          port:
                            number: 80
                      path: /
                      pathType: Prefix
  - apiVersion: v1
    kind: Service
    name: myapplication
    operation: CreateOrUpdate
    match:
      - type: subset
        name: "service created with different port name"
        resource:
          spec:
            ports:
              - port: 80
                targetPort: http
                name: grpc
                protocol: TCP
