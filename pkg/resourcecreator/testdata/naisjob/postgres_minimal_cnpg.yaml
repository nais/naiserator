testconfig:
  description: minimal postgresql provisioned by pgrator/postgres-operator
config:
  features:
    postgres: true
  google-project-id: google-project-id
input:
  kind: NaisJob
  apiVersion: nais.io/v1
  metadata:
    name: mynaisjob
    namespace: mynamespace
    uid: "123456"
  spec:
    image: navikt/mynaisjob:1.2.3
    uses:
      postgres:
        - name: my-postgres-cluster
existing:
  - kind: Namespace
    apiVersion: v1
    metadata:
      name: mynamespace
  - kind: Namespace
    apiVersion: v1
    metadata:
      name: pg-mynamespace
  - kind: Postgres
    apiVersion: data.nais.io/v1
    metadata:
      name: my-postgres-cluster
      namespace: mynamespace
      annotations:
        postgres.nais.io/engine: cnpg
    status:
      engine: cnpg
tests:
  - operation: CreateOrUpdate
    apiVersion: nais.io/v1
    kind: PostgresBinding
    name: my-postgres-cluster-mynaisjob
    match:
      - name: "postgres binding created"
        type: subset
        resource:
          spec:
            postgres: my-postgres-cluster
            secretName: my-postgres-cluster--mynaisjob-b79b367a-connection
            consumer:
              workload:
                name: mynaisjob
                type: job
            credentials: [admin, readwrite]

  - apiVersion: batch/v1
    kind: CronJob
    operation: CreateOrUpdate
    name: mynaisjob
    match:
      - type: subset
        name: "cronjob created"
        exclude:
          - .metadata
          - .status
          - .spec.template.metadata
        resource:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    containers:
                      - name: mynaisjob
                        env:
                          - name: PGHOST
                            valueFrom:
                              secretKeyRef:
                                name: my-postgres-cluster--mynaisjob-b79b367a-connection
                                key: PGHOST
                          - name: PGPORT
                            valueFrom:
                              secretKeyRef:
                                name: my-postgres-cluster--mynaisjob-b79b367a-connection
                                key: PGPORT
                          - name: PGDATABASE
                            valueFrom:
                              secretKeyRef:
                                name: my-postgres-cluster--mynaisjob-b79b367a-connection
                                key: PGDATABASE
                          - name: PGUSER
                            valueFrom:
                              secretKeyRef:
                                name: my-postgres-cluster--mynaisjob-b79b367a-connection
                                key: PGUSER
                          - name: PGURL
                            value: postgresql://$(PGUSER)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslcert=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Fmy-postgres-cluster%2Fadmin%2Ftls.crt&sslkey=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Fmy-postgres-cluster%2Fadmin%2Ftls.key&sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Fmy-postgres-cluster%2Fca.crt
                          - name: PGJDBCURL
                            value: jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)?user=$(PGUSER)&sslcert=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Fmy-postgres-cluster%2Fadmin%2Ftls.crt&sslkey=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Fmy-postgres-cluster%2Fadmin%2Ftls.pk8&sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Fmy-postgres-cluster%2Fca.crt
