testconfig:
  description: Naisjob gets one prefixed read-only Postgres credential binding
config:
  features:
    postgres: true
input:
  kind: Naisjob
  apiVersion: nais.io/v1
  metadata:
    name: myjob
    namespace: mynamespace
    uid: "123456"
  spec:
    image: navikt/myjob:1.2.3
    uses:
      postgres:
        - name: reporting
          role: read
          envPrefix: REPORTING_
tests:
  - operation: CreateOrUpdate
    apiVersion: nais.io/v1
    kind: PostgresBinding
    name: reporting-myjob
    match:
      - name: read binding created for Naisjob
        type: subset
        resource:
          spec:
            postgres: reporting
            consumer:
              workload:
                name: myjob
                type: job
            credentials: [read]
  - operation: CreateOrUpdate
    apiVersion: batch/v1
    kind: CronJob
    name: myjob
    match:
      - name: prefixed JDBC URL and legacy PEM path reach the job container
        type: subset
        resource:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    containers:
                      - name: myjob
                        env:
                          - name: REPORTING_READ_PGSSLKEY
                            value: /var/run/secrets/nais.io/postgres/reporting/read/tls.key
                          - name: REPORTING_READ_PGJDBCURL
                            value: jdbc:postgresql://$(REPORTING_READ_PGHOST):$(REPORTING_READ_PGPORT)/$(REPORTING_READ_PGDATABASE)?user=$(REPORTING_READ_PGUSER)&sslcert=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Freporting%2Fread%2Ftls.crt&sslkey=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Freporting%2Fread%2Ftls.pk8&sslmode=verify-full&sslrootcert=%2Fvar%2Frun%2Fsecrets%2Fnais.io%2Fpostgres%2Freporting%2Fca.crt
