testconfig:
  description: application gets one stable Postgres binding
config:
  features:
    postgres: true
input:
  kind: Application
  apiVersion: nais.io/v1alpha1
  metadata:
    name: myapplication
    namespace: mynamespace
    uid: "123456"
  spec:
    image: navikt/myapplication:1.2.3
    uses:
      postgres:
        - name: mydb
tests:
  - operation: CreateOrUpdate
    apiVersion: nais.io/v1
    kind: PostgresBinding
    name: mydb-myapplication
    match:
      - name: binding created with expanded credentials
        type: subset
        resource:
          spec:
            postgres: mydb
            consumer:
              workload:
                name: myapplication
                type: application
            credentials: [admin, readwrite]
