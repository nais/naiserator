---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: postgresbindings.nais.io
spec:
  group: nais.io
  names:
    categories:
    - nais
    kind: PostgresBinding
    listKind: PostgresBindingList
    plural: postgresbindings
    singular: postgresbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.postgres
      name: Postgres
      type: string
    - jsonPath: .spec.consumer.workload.name
      name: Workload
      type: string
    - jsonPath: .spec.consumer.workload.type
      name: Type
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .status.reconcileTime
      name: Last reconcile
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresBinding grants a consumer access to a Postgres instance in the same
          namespace. It results in a database role authenticated by a client certificate,
          plus the Secrets the consumer needs to connect.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PostgresBinding
            properties:
              consumer:
                description: Consumer identifies what is granted access.
                properties:
                  workload:
                    description: |-
                      Workload identifies the Application or Naisjob granted access. Its name is
                      the readable prefix of the login role shown in pg_stat_activity and the audit
                      log.
                    properties:
                      name:
                        description: Name is the name of the Application or Naisjob.
                        type: string
                      type:
                        description: Type identifies whether the workload is an Application
                          or Naisjob.
                        enum:
                        - application
                        - job
                        type: string
                    required:
                    - name
                    - type
                    type: object
                type: object
                x-kubernetes-validations:
                - message: workload consumer is required
                  rule: has(self.workload)
              postgres:
                description: |-
                  Postgres is the name of the Postgres instance to bind to. The instance must
                  live in the same namespace: bindings never cross team boundaries.
                type: string
              role:
                description: Role is the level of access granted to the consumer.
                enum:
                - read
                - readwrite
                - admin
                type: string
              secretName:
                description: |-
                  SecretName is the complete name of the client-certificate Secret consumed by
                  the binding's consumer. It must be unique per binding so one consumer can hold
                  multiple roles for the same Postgres instance. CloudNativePG derives this name
                  by appending "-client-cert" to the DatabaseRole name.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*-client-cert$
                type: string
            required:
            - consumer
            - postgres
            - role
            - secretName
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: status defines the observed state of PostgresBinding
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the controlled resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              correlationID:
                type: string
              observedGeneration:
                format: int64
                type: integer
              reconcilePhase:
                type: string
              reconcileTime:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
